name: cicd-develop
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"

concurrency:
  group: cicd-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "commit $GITHUB_SHA"; sleep 60
